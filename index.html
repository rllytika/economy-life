['andi','Andi','Pengangguran Terbuka',5,17,['Halo, {n}! Aku Andi, lulusan SMA di Kota Harapan.','Sudah berbulan-bulan aku mengirim lamaran, tapi belum ada panggilan kerja...','Aku termasuk angkatan kerja dan aktif mencari kerja, tetapi belum bekerja. Itu disebut pengangguran terbuka.','Bantu aku menyusun berkas lamaran di Papan Lowongan, depan Job Center (gedung biru di utara) ya!'],'Papan Lowongan ada di depan Job Center, utara alun-alun.','Berkat kamu lamaranku sudah terkirim. Aku optimis!'],
['sinta','Sinta','Pengangguran Terdidik',19,8,['Aku Sinta, lulusan S1. Tapi sampai sekarang belum dapat kerja.','Banyak lowongan menuntut keterampilan yang tidak cocok dengan jurusanku. Inilah pengangguran terdidik: berpendidikan, tetapi kualifikasi tidak sesuai kebutuhan pasar kerja.','Bantu aku mencari lowongan yang cocok dan berlatih wawancara di Meja Wawancara!'],'Meja Wawancara ada di depan Job Center.','Wawancaraku jadi lebih percaya diri. Terima kasih!'],

['joko','Pak Joko','Setengah Menganggur',40,14,['Hai, aku Pak Joko, penjaga kios. Aku hanya bekerja 15 jam per minggu.','Aku sudah bekerja, tetapi jam kerjaku kurang dari normal dan aku mau menambah jam. Itu setengah menganggur.','Bedanya dengan pengangguran terbuka: mereka belum bekerja sama sekali, sedangkan aku sudah punya pekerjaan.','Amati kiosku, lalu bantu cari peluang kerja tambahan!'],'Kiosku ada di sebelah kanan.','Kini aku punya kerja tambahan. Mantap!'],

['hasan','Pak Hasan','Pengangguran Terselubung',29,13,['Aku Pak Hasan, pemilik warung keluarga ini.','Warung ini dikerjakan 5 orang padahal cukup 2 orang. Sebagian tampak bekerja, tetapi sumbangannya kecil. Itu pengangguran terselubung: tenaga kerja berlebih sehingga sebagian tidak benar-benar dibutuhkan.','Bantu aku mengamati warung dan mengatur pembagian kerja!'],'Warung Keluarga ada di sebelah kananku.','Anggota keluargaku kini punya usaha sesuai keahliannya!'],
['rahmat','Pak Rahmat','Pengangguran Struktural',39,12,['Aku Pak Rahmat, mantan buruh pabrik tekstil manual.','Ekonomi kota bergeser dari industri padat karya ke jasa dan digital. Keahlianku tidak cocok lagi. Itu pengangguran struktural: akibat perubahan struktur ekonomi.','Periksa Papan Perubahan Ekonomi di dekat sini, lalu bantu aku memilih jalan keluar.'],'Papan Perubahan Ekonomi ada di sebelah kanan.','Aku mulai belajar keterampilan baru. Terima kasih!'],
['rina','Rina','Pengangguran Friksional',11,12,['Aku Rina. Baru saja berhenti dari kantor lamaku.','Aku sengaja pindah untuk mencari kerja yang lebih cocok, jadi menganggur sementara. Itu pengangguran friksional: terjadi saat berpindah atau mencari pekerjaan, biasanya singkat.','Bantu aku mencari informasi di Papan Karier!'],'Papan Karier ada di bawah sini.','Aku sudah dapat panggilan wawancara!'],
